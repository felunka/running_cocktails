name: Deploy

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  deploy:
    runs-on: [self-hosted]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Set maps api key in html
        run: sed -i 's/§§_MAPS_API_KEY_§§/${{ secrets.MAPS_API_KEY }}/g' htdocs/index.html
      - name: Set maps api key in js
        run: sed -i 's/§§_MAPS_API_KEY_§§/${{ secrets.MAPS_API_KEY }}/g' htdocs/scripts/app.js
      - name: Run containers
        run: >
          docker compose --file docker-compose.yml --project-name running_cocktails up -d --remove-orphans --build
